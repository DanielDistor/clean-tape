[project]
name = "cleantape"
version = "0.1.0"
description = "A morning markets dashboard and end-of-day report that checks the data before anyone sees it."
authors = [{ name = "DanielDistor" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==2.0.0",
    "exchange-calendars==4.13.2",
    "jinja2==3.1.6",
    "openpyxl==3.1.5",
    "pandas==3.1.1",
    "plotly==7.1.0",
    "pyarrow==26.0.1",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "typer==0.28.0",
    "yfinance==1.8.0",
]

[project.scripts]
cleantape = "cleantape.cli:app"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "DTZ", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
