# Clean Tape runtime settings. All paths are relative to the repo root.
paths:
  state_dir: state          # local pipeline state (in CI: checkout of the `data` branch)
  site_dir: site            # static site build output (never committed)
  logs_dir: logs
  universe: config/universe.yaml
  portfolio: config/portfolio.csv

display_timezone: America/New_York

# Logical run slots, in New York time. `cleantape run --slot auto` runs only inside a window
# and only if that slot has not already succeeded today.
slots:
  morning: {start: "06:30", end: "09:30", report: false}
  evening: {start: "18:15", end: "22:00", report: true}

# A daily bar for NYSE instruments for date D is stored only after this NY time on D.
nyse_close_buffer: "16:30"

ingest:
  backfill_start: 2020-01-01
  lookback_business_days: 10
  http_timeout_s: 30
  retries: 4
  backoff_base_s: 2.0
  raw_retention_days: 20
  user_agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7) clean-tape/0.1"

derive:
  zscore_window: 252
  zscore_min_obs: 120
  ffill_max_days: 3

checks:
  freshness: {warn_business_days: 1, fail_business_days: 2}
  completeness: {lookback_business_days: 10, fail_missing_sessions: 3, row_count_tolerance: 0.5}
  staleness: {warn_sessions: 4}
  outliers: {warn_z: 4.0, fail_z: 6.0}
  spread_identity_tolerance_bp: 0.0001
  # Cross-source / triangle tolerances are calibrated from history by `cleantape calibrate`
  # and written to config/calibration.yaml (merged in here at load time).
  # Method: tolerance = quantile(|a/b - 1|) x safety_factor, over all common dates.
  calibration:
    start: 2021-01-01        # excludes the Mar–Apr 2020 WTI storage crisis (spot 40% below front-month)
    warn_quantile: 0.99
    fail_quantile: 0.999
    safety_factor: 1.5
    min_price: 10.0          # skip dates where the reference price is below this (Apr 2020 WTI)
    exclude_roll_days: true  # futures: drop dates where the roll proxy ETF is calm but futures jump
  consistency: {}

# Linear shock scenarios for the MOCK portfolio (first-order approximations, labelled as such).
shocks:
  - {name: "Rates +50bp parallel", kind: rates_bp, size: 50}
  - {name: "Rates -50bp parallel", kind: rates_bp, size: -50}
  - {name: "Equities +5%", kind: asset_class_pct, target: equities, size: 5}
  - {name: "Equities -5%", kind: asset_class_pct, target: equities, size: -5}
  - {name: "Oil +10%", kind: instruments_pct, target: "USO", size: 10}
  - {name: "Oil -10%", kind: instruments_pct, target: "USO", size: -10}
  - {name: "USD +3%", kind: usd_pct, size: 3}
  - {name: "USD -3%", kind: usd_pct, size: -3}

site:
  title: Clean Tape
  base_url: https://danieldistor.github.io/clean-tape/
  repo_url: https://github.com/DanielDistor/clean-tape
  stale_after_business_days: 1
  report_archive_days: 30
  hero: [SPY, DGS10, S2S10S, EURUSD, CL_F, VIX]
